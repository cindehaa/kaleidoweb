<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#F7F6F3;font:12px monospace}
.cell{position:relative;width:720px;height:300px;margin:0 0 4px;overflow:hidden}
.cell .lb{position:absolute;left:8px;top:6px;z-index:5;background:#fff;padding:2px 5px}
.cell canvas{display:block}
.t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:4;font:700 76px "Helvetica";letter-spacing:-.02em}
</style></head><body>
<div id="grid"></div>
<script src="./vendor/paper-shaders.global.js"></script>
<script>
const { ShaderMount, godRaysFragmentShader, grainGradientFragmentShader, getShaderColorFromString, getShaderNoiseTexture } = window.PaperShaders;
const noise = getShaderNoiseTexture();
const C = getShaderColorFromString;
function sizing(o){const d={u_fit:2,u_scale:1,u_rotation:0,u_originX:.5,u_originY:.5,u_offsetX:0,u_offsetY:0,u_worldWidth:0,u_worldHeight:0};return Object.assign(d,o||{})}
function pad(colors,n){const a=colors.map(C);while(a.length<n)a.push([0,0,0,1]);return a}

const variants = [
 ['A godrays warm-on-bond', godRaysFragmentShader, Object.assign(sizing({u_offsetY:.55,u_scale:1.1}),{
   u_colorBack:C('#F7F6F3'), u_colorBloom:C('#FFFFFF'), u_colors:pad(['#E9E4D6','#D8D2C0','#F2ECDC','#CFCABB'],5), u_colorsCount:4,
   u_density:.7,u_spotty:.15,u_midSize:.4,u_midIntensity:.35,u_intensity:.5,u_bloom:.4,u_noiseTexture:noise})],
 ['B godrays hard white sun', godRaysFragmentShader, Object.assign(sizing({u_offsetY:.75,u_scale:1.6}),{
   u_colorBack:C('#F7F6F3'), u_colorBloom:C('#FFFFFF'), u_colors:pad(['#FFFFFF','#EFEAD9','#E3DCC6'],5), u_colorsCount:3,
   u_density:.35,u_spotty:.05,u_midSize:.85,u_midIntensity:.8,u_intensity:.8,u_bloom:.9,u_noiseTexture:noise})],
 ['C godrays dark (space)', godRaysFragmentShader, Object.assign(sizing({u_scale:1.2}),{
   u_colorBack:C('#07080A'), u_colorBloom:C('#9AA7B5'), u_colors:pad(['#FFFFFF','#C8D2DC'],5), u_colorsCount:2,
   u_density:.2,u_spotty:.9,u_midSize:.1,u_midIntensity:.2,u_intensity:.3,u_bloom:.2,u_noiseTexture:noise})],
 ['D grain lunar greys (wave)', grainGradientFragmentShader, Object.assign(sizing({u_scale:.8}),{
   u_colorBack:C('#0B0B0C'), u_colors:pad(['#8A8779','#4A4842','#B9B4A4'],7), u_colorsCount:3,
   u_softness:.9,u_intensity:.35,u_noise:.55,u_shape:1,u_noiseTexture:noise})],
 ['E grain lunar greys (ripple)', grainGradientFragmentShader, Object.assign(sizing({u_scale:.55}),{
   u_colorBack:C('#1A1917'), u_colors:pad(['#9C978A','#38362F'],7), u_colorsCount:2,
   u_softness:1,u_intensity:.2,u_noise:.8,u_shape:5,u_noiseTexture:noise})],
 ['F grain bond dust', grainGradientFragmentShader, Object.assign(sizing({u_scale:.6}),{
   u_colorBack:C('#F7F6F3'), u_colors:pad(['#E2DED2','#CFCABB'],7), u_colorsCount:2,
   u_softness:1,u_intensity:.15,u_noise:.9,u_shape:6,u_noiseTexture:noise})],
];
const grid = document.getElementById('grid');
noise.decode().then(run).catch(run);
function run(){
for (const [name, frag, uni] of variants){
  const d = document.createElement('div'); d.className='cell';
  const lb = document.createElement('div'); lb.className='lb'; lb.textContent=name;
  const t = document.createElement('div'); t.className='t'; t.textContent='Apollo 11';
  grid.appendChild(d); d.appendChild(lb); d.appendChild(t);
  try { new ShaderMount(d, frag, uni, undefined, .35); } catch(e){ lb.textContent = name+' FAIL '+e.message; }
}
}
</script></body></html>
